<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <title>html-in-canvas-project</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* Chaque page est un enfant drawable plein écran du canvas.
         En absolu pour que deux pages (pendant une transition) se superposent. */
      canvas > .page {
        position: absolute;
        top: 0;
        left: 0;
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
      }

      /* Bouton "Suivant" : présent dans le DOM de chaque page (il se casse avec elle).
         Bouton natif, juste positionné. */
      canvas > .page > .next-button {
        position: absolute;
        right: 32px;
        bottom: 32px;
      }
    </style>
  </head>
  <body>
    <!-- content="drawable" : les enfants sont mis en page mais c'est nous qui les dessinons. -->
    <canvas content="drawable"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
